<!DOCTYPE html>
<html>

<head>
<title>NOAA Test</title>
</head>

<body>

<h1>NOAA Connection Test</h1>

<pre id="output">
Loading...
</pre>


<script>

fetch(
"https://api.weather.gov/points/39.42,-76.33"
)

.then(response => response.json())

.then(data => {

document.getElementById("output").innerHTML =
JSON.stringify(data,null,2);

})

.catch(error => {

document.getElementById("output").innerHTML =
"Error: " + error;

});

</script>

</body>

</html>
