
<!DOCTYPE html>
<html>

<head>
<title>NOAA Hourly Test</title>
</head>

<body>

<h1>NOAA Hourly Forecast Test</h1>

<pre id="output">
Loading...
</pre>


<script>

fetch(
"https://api.weather.gov/gridpoints/LWX/118,98/forecast/hourly"
)

.then(response => response.json())

.then(data => {

document.getElementById("output").innerHTML =
JSON.stringify(data,null,2);

})

.catch(error => {

document.getElementById("output").innerHTML =
"Error: " + error;

});

</script>

</body>

</html>
